# Config do teste - aponta para a planilha-exemplo.xlsx do repositorio.
# Rode sempre a partir da pasta raiz do projeto:
#     java -jar gerador-arquivo-txt.jar --console --config exemplo/config-exemplo.properties
# O conferir.bat faz isso sozinho, numa copia deste arquivo (o programa
# regrava a linha saida.destino a cada geracao).

planilha.caminho=exemplo/planilha-exemplo.xlsx
planilha.abaPrincipal=Principal
planilha.abaBase=Base

controle.celulaB6=B6
controle.celulaB7=B7
controle.celulaPasta=B9
controle.celulaNome=B10
controle.obrigatorias=B6,B7

base.colunaInicial=A
base.colunaFinal=I
base.linhaInicial=2
base.pararNaLinhaVazia=false

layout.separador=|
layout.prefixoCabecalho=6000
layout.camposCabecalho=X,,,
layout.prefixoDetalhe=6100
layout.substitutoSeparador= 

saida.codificacao=windows-1252
saida.quebraLinha=crlf
saida.extensao=.txt
saida.sobrescrever=sempre
saida.destino=exemplo/saida-do-teste.txt
saida.linhaEmBrancoNoInicio=true
