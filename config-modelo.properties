# ADAPTED DOM IMPORT - configuracao
#
# O config-modelo.properties e o molde: na primeira abertura o programa
# copia ele para config.properties e passa a usar a copia, que fica so
# nesta maquina. Mexa sempre no config.properties.
#
# Em geral nao e preciso editar nada aqui: a janela preenche a planilha,
# os campos do nome e a pasta, e regrava este arquivo a cada geracao.
#
# ATENCAO: barra invertida e caractere de escape neste arquivo.
# Escreva o caminho com barra normal  C:/pasta/arquivo.xlsx
# ou com barra dupla                  C:\\pasta\\arquivo.xlsx
# Barra simples engole o caractere seguinte em silencio.

# ---------- planilha
# em branco = escolha pelo botao Selecionar... na janela
planilha.caminho=
planilha.abaBase=Base

# ---------- nome e destino do arquivo
# O nome sai destes tres campos, pelo molde abaixo. A janela mostra o
# resultado em tempo real, e regrava estas linhas a cada geracao.
saida.empresa=
saida.tipo=
saida.competencia=
saida.pasta=
# pecas disponiveis: {empresa} {tipo} {competencia}
# campo vazio nao deixa separador solto: 744__082025 sai 744_082025
saida.nomePadrao={empresa}_{tipo}_{competencia}

# ---------- aba Principal: so para quem ficou no jeito antigo
# false = o nome e a pasta sao os de cima, e a planilha nem precisa ter a
#         aba Principal (uma aba a menos para alguem digitar por engano)
# true  = volta a ler B6/B7 obrigatorias, B9 pasta e B10 nome da aba Principal
controle.usarAbaPrincipal=false
planilha.abaPrincipal=Principal
controle.celulaB6=B6
controle.celulaB7=B7
controle.celulaPasta=B9
controle.celulaNome=B10
controle.obrigatorias=B6,B7

# ---------- aba Base
base.colunaInicial=A
base.colunaFinal=I
base.linhaInicial=2
# false = varre ate o fim e pula linha vazia (recomendado)
# true  = para na primeira linha vazia, como a macro antiga fazia
base.pararNaLinhaVazia=false

# ---------- layout do txt
layout.separador=|
layout.prefixoCabecalho=6000
# "X,,," produz  6000|X||||
layout.camposCabecalho=X,,,
layout.prefixoDetalhe=6100
layout.substitutoSeparador=\u0020

# ---------- saida
saida.codificacao=windows-1252
saida.quebraLinha=crlf
saida.extensao=.txt
# recusar  = se o arquivo existir, nao grava (igual a macro)
# perguntar = mostra a pergunta na tela
# sempre    = sobrescreve sem perguntar (use no agendador)
saida.sobrescrever=recusar
# true = comeca o arquivo com uma linha em branco, como o Print # do VBA fazia
saida.linhaEmBrancoNoInicio=true
# so informativo: o programa regrava estas duas linhas a cada geracao
saida.ultimoArquivo=
saida.ultimaGeracao=
