# Gerador de Arquivo TXT - configuracao
# Ajuste e salve. Nada aqui exige recompilar o programa.
#
# ATENCAO: barra invertida e caractere de escape neste arquivo.
# Escreva o caminho com barra normal  C:/pasta/arquivo.xlsx
# ou com barra dupla                  C:\\pasta\\arquivo.xlsx
# Barra simples engole o caractere seguinte em silencio.

# ---------- planilha (troque pelo caminho da sua planilha de verdade)
planilha.caminho=C:/Users/Lira/Documents/DOM IMPORTA ARRUMADO USAR ESSE PFV.xlsm
planilha.abaPrincipal=Principal
planilha.abaBase=Base

# ---------- celulas de controle (aba Principal)
controle.celulaB6=B6
controle.celulaB7=B7
controle.celulaPasta=B9
controle.celulaNome=B10
controle.obrigatorias=B6,B7

# ---------- aba Base
base.colunaInicial=A
base.colunaFinal=I
base.linhaInicial=2
# false = varre ate o fim e pula linha vazia (recomendado)
# true  = para na primeira linha vazia, como a macro antiga fazia
base.pararNaLinhaVazia=false

# ---------- layout do txt
layout.separador=|
layout.prefixoCabecalho=6000
# "X,,," produz  6000|X||||
layout.camposCabecalho=X,,,
layout.prefixoDetalhe=6100
layout.substitutoSeparador=\u0020

# ---------- saida
saida.codificacao=windows-1252
saida.quebraLinha=crlf
saida.extensao=.txt
# recusar  = se o arquivo existir, nao grava (igual a macro)
# perguntar = mostra a pergunta na tela
# sempre    = sobrescreve sem perguntar (use no agendador)
saida.sobrescrever=recusar
# caminho completo do txt escolhido na tela; em branco = usa B9 + B10 da planilha
# o programa regrava esta linha sozinho a cada geracao
saida.destino=C:/Users/Lira/Desktop/744_PARCELAMENTOS_082025.txt
# true = comeca o arquivo com uma linha em branco, como o Print # do VBA fazia
saida.linhaEmBrancoNoInicio=true
